[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-philosopher-bot"
version = "0.0.0"
description = "Discover, evaluate, and publish philosopher quotations from Wikimedia sources."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-only"}
dependencies = [
    "beautifulsoup4>=4.9,<4.14",
    "python-dotenv>=0.21,<1.1",
    "requests>=2.22,<2.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<8.4",
    "matplotlib>=3.5,<3.8",
]

[project.scripts]
wiki-philosopher-bot = "wiki_philosopher_bot.main:main"
wiki-philosopher-analyze = "wiki_philosopher_bot.cli.analyze_database:main"
wiki-philosopher-backup = "wiki_philosopher_bot.cli.backup_database:main"
wiki-philosopher-check-recent-deaths = "wiki_philosopher_bot.cli.check_recent_deaths:main"
wiki-philosopher-migrate = "wiki_philosopher_bot.cli.migrate_database:main"
wiki-philosopher-purge-rejected-quotes = "wiki_philosopher_bot.cli.purge_rejected_quotes:main"
wiki-philosopher-reevaluate = "wiki_philosopher_bot.cli.reevaluate_database:main"
wiki-philosopher-refresh-quotes = "wiki_philosopher_bot.cli.refresh_quotes:main"
wiki-philosopher-refresh-wikidata-dates = "wiki_philosopher_bot.cli.refresh_wikidata_dates:main"
wiki-philosopher-prepare-post = "wiki_philosopher_bot.cli.prepare_post:main"
wiki-philosopher-dispatch-post = "wiki_philosopher_bot.cli.dispatch_post:main"
wiki-philosopher-reconcile-post = "wiki_philosopher_bot.cli.reconcile_post:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
