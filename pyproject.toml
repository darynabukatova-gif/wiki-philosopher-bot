[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-philosopher-bot"
version = "0.0.0"
description = "Discover, evaluate, and publish philosopher quotations from Wikimedia sources."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-only"}
dependencies = [
    "beautifulsoup4>=4.9,<4.14",
    "python-dotenv>=0.21,<1.1",
    "requests>=2.22,<2.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<8.4",
    "matplotlib>=3.5,<3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
